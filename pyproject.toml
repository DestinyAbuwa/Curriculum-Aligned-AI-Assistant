[project]
name = "curriculum-aligned-ai-assistant"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "vince-vm", email = "vmartinelli@mail.bradley.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.7",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "torchvision>=0.29.1",
]

[project.scripts]
curriculum-aligned-ai-assistant = "curriculum_aligned_ai_assistant:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
