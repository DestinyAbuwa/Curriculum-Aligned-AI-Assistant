[project]
name = "curriculum-aligned-ai-assistant"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "vince-vm", email = "vmartinelli@mail.bradley.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-openai>=1.7.2",
    "mlx-vlm>=0.4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "langgraph>=1.2.16",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "tavily-python>=0.8.5",
]

[project.scripts]
curriculum-aligned-ai-assistant = "curriculum_aligned_ai_assistant:main"
ask-semantic = "curriculum_aligned_ai_assistant.ask_semantic:main"
ask-hybrid = "curriculum_aligned_ai_assistant.ask_hybrid:main"
ingest = "curriculum_aligned_ai_assistant.ingest.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.36",
    "mypy>=2.3.1",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "streamlit>=1.66.1",
]
ingest = [
    "docling>=2.0.0",
    "langchain-experimental>=0.3.0",
    "langchain-huggingface>=0.1.0",
]

[[tool.mypy.overrides]]
module = [
    "tavily.*",
    # The `ingest` group is not installed in CI.
    "docling.*",
    "docling_core.*",
    "langchain_experimental.*",
    "langchain_huggingface.*",
    "langchain_text_splitters.*",
]
ignore_missing_imports = true
